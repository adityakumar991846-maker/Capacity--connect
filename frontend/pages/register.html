<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Capacity Connect</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YcnS/1p0RDQB1ZOAqz5+fQGeYyppmfKPqv7"
          crossorigin="anonymous">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html">
                <i class="bi bi-lightning-charge-fill me-2"></i>Capacity Connect
            </a>
            <div class="ms-auto">
                <a class="btn btn-outline-light btn-sm" href="../index.html">
                    <i class="bi bi-arrow-left me-1"></i>Back to Home
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-10 col-lg-7 col-xl-6">
                
                <!-- Registration Card -->
                <div class="card border-0 shadow-sm rounded-4 auth-card">
                    <div class="card-body p-4 p-sm-5">
                        
                        <!-- Header -->
                        <div class="text-center mb-4">
                            <div class="bg-primary-subtle text-primary rounded-circle d-inline-flex align-items-center justify-content-center p-3 mb-3">
                                <i class="bi bi-person-plus-fill fs-3"></i>
                            </div>
                            <h3 class="fw-bold text-dark">Create Account</h3>
                            <p class="text-muted small">Join Capacity Connect to develop and enhance your capabilities</p>
                        </div>

                        <!-- Alert Box -->
                        <div id="alertContainer"></div>

                        <!-- Registration Form -->
                        <form id="registerForm" novalidate>
                            
                            <!-- Role Selection -->
                            <div class="mb-4">
                                <label class="form-label fw-semibold small text-secondary d-block">Select Your Role</label>
                                <div class="row g-3">
                                    <div class="col-sm-6">
                                        <label class="role-selector-card card h-100 border p-3 cursor-pointer text-center active" for="roleTrainee">
                                            <input class="form-check-input d-none" type="radio" name="role" id="roleTrainee" value="TRAINEE" checked>
                                            <div class="icon-circle bg-info-subtle text-info-emphasis rounded-circle mx-auto mb-2 d-flex align-items-center justify-content-center" style="width:48px; height:48px;">
                                                <i class="bi bi-mortarboard-fill fs-4"></i>
                                            </div>
                                            <div class="fw-bold text-dark">Trainee</div>
                                            <div class="text-muted small mt-1">Enroll in courses, complete subjects & track progress</div>
                                        </label>
                                    </div>
                                    <div class="col-sm-6">
                                        <label class="role-selector-card card h-100 border p-3 cursor-pointer text-center" for="roleTrainer">
                                            <input class="form-check-input d-none" type="radio" name="role" id="roleTrainer" value="TRAINER">
                                            <div class="icon-circle bg-warning-subtle text-warning-emphasis rounded-circle mx-auto mb-2 d-flex align-items-center justify-content-center" style="width:48px; height:48px;">
                                                <i class="bi bi-person-video3 fs-4"></i>
                                            </div>
                                            <div class="fw-bold text-dark">Trainer</div>
                                            <div class="text-muted small mt-1">Design courses, create subjects & monitor trainees</div>
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <div class="row g-3">
                                <!-- Username -->
                                <div class="col-sm-6 mb-3">
                                    <label for="usernameInput" class="form-label fw-semibold small text-secondary">Username</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0 text-muted">
                                            <i class="bi bi-person"></i>
                                        </span>
                                        <input type="text" class="form-control bg-light border-start-0 ps-0" id="usernameInput" placeholder="johndoe" required>
                                    </div>
                                </div>

                                <!-- Email -->
                                <div class="col-sm-6 mb-3">
                                    <label for="emailInput" class="form-label fw-semibold small text-secondary">Email Address</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0 text-muted">
                                            <i class="bi bi-envelope"></i>
                                        </span>
                                        <input type="email" class="form-control bg-light border-start-0 ps-0" id="emailInput" placeholder="name@example.com" required>
                                    </div>
                                </div>
                            </div>

                            <div class="row g-3">
                                <!-- Password -->
                                <div class="col-sm-6 mb-3">
                                    <label for="passwordInput" class="form-label fw-semibold small text-secondary">Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0 text-muted">
                                            <i class="bi bi-lock"></i>
                                        </span>
                                        <input type="password" class="form-control bg-light border-start-0 ps-0" id="passwordInput" placeholder="Min. 8 characters" required>
                                    </div>
                                </div>

                                <!-- Confirm Password -->
                                <div class="col-sm-6 mb-4">
                                    <label for="confirmPasswordInput" class="form-label fw-semibold small text-secondary">Confirm Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0 text-muted">
                                            <i class="bi bi-lock-fill"></i>
                                        </span>
                                        <input type="password" class="form-control bg-light border-start-0 ps-0" id="confirmPasswordInput" placeholder="Repeat password" required>
                                    </div>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 shadow-sm d-flex align-items-center justify-content-center" id="submitBtn">
                                <span id="btnText">Create Account</span>
                                <span class="spinner-border spinner-border-sm ms-2 d-none" id="btnSpinner" role="status" aria-hidden="true"></span>
                            </button>
                        </form>

                        <!-- Footer Links -->
                        <div class="text-center mt-4 pt-2 border-top">
                            <p class="text-muted small mb-0">
                                Already have an account? 
                                <a href="login.html" class="text-primary fw-semibold text-decoration-none">Sign in</a>
                            </p>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-3 bg-white border-top text-center text-muted small">
        &copy; 2026 Capacity Connect. All rights reserved.
    </footer>

    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>

    <!-- App Scripts -->
    <script src="../js/supabase-client.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/auth.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await Auth.redirectIfAuthenticated();

            const form = document.getElementById('registerForm');
            const usernameInput = document.getElementById('usernameInput');
            const emailInput = document.getElementById('emailInput');
            const passwordInput = document.getElementById('passwordInput');
            const confirmPasswordInput = document.getElementById('confirmPasswordInput');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const alertContainer = document.getElementById('alertContainer');
            const roleCards = document.querySelectorAll('.role-selector-card');

            // Interactive role card toggling
            roleCards.forEach(card => {
                card.addEventListener('click', () => {
                    roleCards.forEach(c => c.classList.remove('active'));
                    card.classList.add('active');
                });
            });

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                alertContainer.innerHTML = '';

                const username = usernameInput.value.trim();
                const email = emailInput.value.trim();
                const password = passwordInput.value;
                const confirmPassword = confirmPasswordInput.value;
                const selectedRole = document.querySelector('input[name="role"]:checked')?.value || 'TRAINEE';

                if (!username || !email || !password || !confirmPassword) {
                    showAlert('Please fill in all fields.', 'danger');
                    return;
                }

                if (password.length < 6) {
                    showAlert('Password must be at least 6 characters.', 'danger');
                    return;
                }

                if (password !== confirmPassword) {
                    showAlert('Passwords do not match.', 'danger');
                    return;
                }

                setLoading(true);

                try {
                    await Auth.register(email, password, username, selectedRole);
                    showAlert('Account created successfully! Redirecting to sign in...', 'success');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1200);
                } catch (err) {
                    console.error('Registration error:', err);
                    showAlert(err.message || 'Registration failed. Please check your details.', 'danger');
                    setLoading(false);
                }
            });

            function showAlert(message, type) {
                alertContainer.innerHTML = `
                    <div class="alert alert-${type} alert-dismissible fade show small" role="alert">
                        <i class="bi ${type === 'success' ? 'bi-check-circle-fill' : 'bi-exclamation-triangle-fill'} me-2"></i>
                        ${message}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                `;
            }

            function setLoading(isLoading) {
                submitBtn.disabled = isLoading;
                if (isLoading) {
                    btnText.textContent = 'Creating Account...';
                    btnSpinner.classList.remove('d-none');
                } else {
                    btnText.textContent = 'Create Account';
                    btnSpinner.classList.add('d-none');
                }
            }
        });
    </script>
</body>
</html>
