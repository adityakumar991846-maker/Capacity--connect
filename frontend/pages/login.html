<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In — Capacity Connect</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YcnS/1p0RDQB1ZOAqz5+fQGeYyppmfKPqv7"
          crossorigin="anonymous">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html">
                <i class="bi bi-lightning-charge-fill me-2"></i>Capacity Connect
            </a>
            <div class="ms-auto">
                <a class="btn btn-outline-light btn-sm" href="../index.html">
                    <i class="bi bi-arrow-left me-1"></i>Back to Home
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-5 col-xl-4">
                
                <!-- Auth Card -->
                <div class="card border-0 shadow-sm rounded-4 auth-card">
                    <div class="card-body p-4 p-sm-5">
                        
                        <!-- Header -->
                        <div class="text-center mb-4">
                            <div class="bg-primary-subtle text-primary rounded-circle d-inline-flex align-items-center justify-content-center p-3 mb-3">
                                <i class="bi bi-shield-lock-fill fs-3"></i>
                            </div>
                            <h3 class="fw-bold text-dark">Welcome Back</h3>
                            <p class="text-muted small">Sign in with your Capacity Connect account</p>
                        </div>

                        <!-- Alert Box -->
                        <div id="alertContainer"></div>

                        <!-- Login Form -->
                        <form id="loginForm" novalidate>
                            <div class="mb-3">
                                <label for="emailInput" class="form-label fw-semibold small text-secondary">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted">
                                        <i class="bi bi-envelope"></i>
                                    </span>
                                    <input type="email" class="form-control bg-light border-start-0 ps-0" id="emailInput" placeholder="name@example.com" required autofocus>
                                </div>
                            </div>

                            <div class="mb-4">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <label for="passwordInput" class="form-label fw-semibold small text-secondary mb-0">Password</label>
                                </div>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted">
                                        <i class="bi bi-lock"></i>
                                    </span>
                                    <input type="password" class="form-control bg-light border-start-0 border-end-0 ps-0" id="passwordInput" placeholder="Enter your password" required>
                                    <button class="btn btn-light border border-start-0 text-muted" type="button" id="togglePasswordBtn">
                                        <i class="bi bi-eye" id="togglePasswordIcon"></i>
                                    </button>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 shadow-sm d-flex align-items-center justify-content-center" id="submitBtn">
                                <span id="btnText">Sign In</span>
                                <span class="spinner-border spinner-border-sm ms-2 d-none" id="btnSpinner" role="status" aria-hidden="true"></span>
                            </button>
                        </form>

                        <!-- Footer Links -->
                        <div class="text-center mt-4 pt-2 border-top">
                            <p class="text-muted small mb-0">
                                Don't have an account? 
                                <a href="register.html" class="text-primary fw-semibold text-decoration-none">Create an account</a>
                            </p>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-3 bg-white border-top text-center text-muted small">
        &copy; 2026 Capacity Connect. All rights reserved.
    </footer>

    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>

    <!-- App Scripts -->
    <script src="../js/supabase-client.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/auth.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Check if user is already logged in
            await Auth.redirectIfAuthenticated();

            const form = document.getElementById('loginForm');
            const emailInput = document.getElementById('emailInput');
            const passwordInput = document.getElementById('passwordInput');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const alertContainer = document.getElementById('alertContainer');
            const togglePasswordBtn = document.getElementById('togglePasswordBtn');
            const togglePasswordIcon = document.getElementById('togglePasswordIcon');

            // Password show/hide toggle
            togglePasswordBtn.addEventListener('click', () => {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                togglePasswordIcon.className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
            });

            // Handle submission
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                alertContainer.innerHTML = '';

                const email = emailInput.value.trim();
                const password = passwordInput.value;

                if (!email || !password) {
                    showAlert('Please enter both email and password.', 'danger');
                    return;
                }

                // Set loading state
                setLoading(true);

                try {
                    const result = await Auth.login(email, password);
                    showAlert('Sign in successful! Redirecting to your dashboard...', 'success');
                    setTimeout(() => {
                        const urlParams = new URLSearchParams(window.location.search);
                        const redirectUrl = urlParams.get('redirect') || 'dashboard.html';
                        window.location.href = redirectUrl;
                    }, 600);
                } catch (err) {
                    console.error('Login error:', err);
                    showAlert(err.message || 'Invalid email or password.', 'danger');
                    setLoading(false);
                }
            });

            function showAlert(message, type) {
                alertContainer.innerHTML = `
                    <div class="alert alert-${type} alert-dismissible fade show small" role="alert">
                        <i class="bi ${type === 'success' ? 'bi-check-circle-fill' : 'bi-exclamation-triangle-fill'} me-2"></i>
                        ${message}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                `;
            }

            function setLoading(isLoading) {
                submitBtn.disabled = isLoading;
                if (isLoading) {
                    btnText.textContent = 'Signing in...';
                    btnSpinner.classList.remove('d-none');
                } else {
                    btnText.textContent = 'Sign In';
                    btnSpinner.classList.add('d-none');
                }
            }
        });
    </script>
</body>
</html>
